name: CLI PR Checks

# Called by the Merge Gate workflow (merge-gate.yml) for non-draft PRs that change the CLI, core or
# packages; also runs nightly on main and on dispatch. PRs run one OS and one Node version (fast);
# the full OS x Node matrix runs nightly and on dispatch.
on:
  workflow_call:
    inputs:
      # JSON array of the changed files, from the merge gate's `changes` job, for affected-only unit
      # tests on pull requests (scripts/ci/affected-tests.mjs); empty means run everything.
      changed_files:
        type: string
        default: ""
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight; without this
# the fork's runner pool fills with stale runs and nothing starts.
# The group name is a literal: in a called workflow github.workflow is the caller's name, which would
# put this and PR Checks into one group and cancel each other.
concurrency:
  group: cli-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# onnxruntime-node's postinstall fetches its CUDA libraries from GitHub releases on Linux. Packaging drops them and nothing here uses a GPU, so don't let that download fail the job.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  track-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: (github.run_attempt > 1) && github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v7
      - name: Track workflow rerun
        uses: ./.github/actions/track-rerun

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: extensions/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install dependencies
        run: |
          cd extensions/cli
          npm ci --include=optional

      - name: Run linting
        run: |
          cd extensions/cli
          npm run lint

  test:
    strategy:
      matrix:
        os: ${{ fromJSON(contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        node-version: ${{ fromJSON(contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && '[22]' || '[22,24]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      # The setup-packages action switched node to the version in .nvmrc, whatever the matrix
      # says, so the key names the version that is on the path now. Exact hit only: a partial
      # restore of node_modules must not stand in for `npm ci`. Saved from main only.
      - name: Node version
        id: nodev
        run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

      - name: Restore CLI node_modules
        id: cli-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extensions/cli/node_modules
          key: ${{ runner.os }}-node${{ steps.nodev.outputs.version }}-cli-modules-${{ hashFiles('extensions/cli/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd extensions/cli
          if [ "${{ steps.cli-modules.outputs.cache-hit }}" != "true" ]; then
            npm ci --include=optional
          fi

      - name: Save CLI node_modules
        if: steps.cli-modules.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extensions/cli/node_modules
          key: ${{ steps.cli-modules.outputs.cache-primary-key }}

      - uses: ./.github/actions/cache-report
        if: always()
        with:
          entries: |
            cli-node-modules|${{ steps.cli-modules.outcome }}|${{ steps.cli-modules.outputs.cache-hit }}|${{ steps.cli-modules.outputs.cache-matched-key }}

      - name: Build
        run: |
          cd extensions/cli
          npm run build

      - name: Run smoke tests
        run: |
          cd extensions/cli
          npm run test:smoke

      # Pull requests: the unit tests related to the changed CLI modules plus a smoke set, or everything
      # when narrowing is not safe; in shadow mode (the default) the selection is only reported. The
      # smoke and e2e tests around this step always run in full.
      - name: Run tests
        run: node scripts/ci/affected-tests.mjs --suite cli
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ inputs.changed_files }}
          # Unset: shadow mode (select, report, run everything). `on`: run the selection.
          AFFECTED_TESTS: ${{ vars.CI_AFFECTED_TESTS }}

      # e2e tests are failing on Windows specifically - likely due to stdout flush issues
      - name: Run e2e tests
        if: matrix.os != 'windows-latest'
        run: |
          cd extensions/cli
          npm run test:e2e

  smoke-api:
    # Only runs when secrets are available (not on fork PRs)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: extensions/cli/package-lock.json

      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install dependencies
        run: |
          cd extensions/cli
          npm ci --include=optional

      - name: Build
        run: |
          cd extensions/cli
          npm run build

      - name: Run smoke API tests
        env:
          # The tests skip without this, whatever keys are set
          RUN_SMOKE_API: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTINUE_API_KEY: ${{ secrets.CONTINUE_API_KEY }}
        run: |
          cd extensions/cli
          npm run test:smoke-api

  # GitHub does not have a way of requiring that all checks pass (you must manually select each job)
  # This action at least lets us manage the list of required tests via source control
  # so that creators of new jobs can add them to this list
  require-all-checks-to-pass-cli:
    # Nightly and dispatch runs only; under the Merge Gate the called workflow's result is evaluated
    # by the gate (docs/ci-merge-gate.md), and this job would be one more runner slot.
    if: always() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - test
      - smoke-api

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          # smoke-api is allowed to skip for fork PRs that lack secrets
          allowed-skips: smoke-api
          jobs: ${{ toJSON(needs) }}
