name: Supply Chain

# Advisory checks, NOT required: the merge gate (docs/ci-merge-gate.md) evaluates only the PR Checks
# and CLI PR Checks workflows it calls, so nothing here can block or stall a merge. Do not add these
# jobs to the gate's `needs`. Policy: docs/supply-chain.md.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "plans/**"
      - "**/*.md"
      - "**/*.mdx"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # v5.0.0
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          # Licence check on changed dependencies (runtime scope). Strong copyleft and
          # non-commercial or source-available licences are denied; LGPL is not on the list
          # because sharp's prebuilt libvips (LGPL, dynamically loaded) is already shipped
          # and reviewed (scripts/licenses/exceptions.json). Checked on 2026-11-11 against all
          # lockfiles: only three runtime or dev packages carry a denied id, each in a
          # dual-licence expression with a permissive option, so they are allowed by purl:
          #   node-forge (BSD-3-Clause OR GPL-2.0), elkjs (EPL-2.0 OR GPL-3.0-or-later),
          #   jszip (MIT OR GPL-3.0-or-later).
          # mintlify (Elastic-2.0) is docs tooling in the dev scope, which is not evaluated.
          # The build-time gate for what ships is scripts/licenses/third-party-notices.mjs.
          license-check: true
          deny-licenses: GPL-2.0, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-3.0, CC-BY-NC-4.0, CC-BY-NC-SA-3.0, CC-BY-NC-SA-4.0, CC-BY-NC-ND-4.0
          allow-dependencies-licenses: pkg:npm/node-forge, pkg:npm/elkjs, pkg:npm/jszip

  pins-and-notice:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 10
    # pull-requests: read is for the roadmap state step, which lists pull request states.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # packageManager in package.json would turn the npm cache on here
          package-manager-cache: false
      - name: Pin policy
        run: |
          node scripts/ci/check-pins.mjs
          node --test scripts/ci/check-pins.test.mjs
      # The npm on this runner against packageManager, and lockfileVersion in every lockfile.
      # It cannot tell npm 10 from npm 11 by the lockfile: both write lockfileVersion 3.
      - name: npm pin
        run: |
          node --test scripts/ci/check-npm-pin.test.mjs
          node scripts/ci/check-npm-pin.mjs
      - name: Fixture provenance and licences (strict)
        run: |
          node scripts/ci/check-notice.mjs --strict
          node --test scripts/ci/check-notice.test.mjs scripts/ci/backfill-fixture-licence.test.mjs
      - name: Shipped legal files (artefact checker and notices generator tests)
        run: node --test scripts/ci/check-artefact-licences.test.mjs scripts/licenses/third-party-notices.test.mjs
      - name: Process-guard scripts (merge-tree matrix, worktree hygiene, stash guard, checkpoint)
        run: node --test scripts/ci/combine.test.mjs scripts/ci/changed-areas.test.mjs scripts/ci/affected-tests.test.mjs scripts/ci/check-stash.test.mjs scripts/ci/worktree-hygiene.test.mjs "scripts/agents/*.test.mjs"
      - name: Lab boundary (the product never imports bench/; contract, result schema, governor)
        run: |
          node scripts/ci/check-bench-boundary.mjs
          node --test scripts/ci/check-bench-boundary.test.mjs bench/lab/test/contract.test.mjs
      # Not blocking yet: plans/ROADMAP.md had 130 stale claims on 2026-11-21. Remove
      # continue-on-error once the sweep brings the count to 0. No other job runs
      # roadmap-ids.js, so this step is the first roadmap check in CI.
      - name: Roadmap state (claims about pull requests against GitHub; not blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/ci/roadmap-state.test.js
          node scripts/ci/roadmap-state.js
